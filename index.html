<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="HUB MED — Accesorios e insumos médicos universitarios. Be the vibe. Wear your world.">
<title>HUB MED — Accesorios & Insumos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-circle-1"></div>
  <div class="hero-circle-2"></div>
  <div class="hero-inner">
    <div class="hero-tag">✦ Accesorios &nbsp;·&nbsp; Insumos &nbsp;·&nbsp; Tu estilo</div>
    <h1 class="hero-title">HUB<em>MED</em></h1>
    <p class="hero-sub">Be the vibe. Wear your world.</p>
    <div class="hero-line"></div>
  </div>
  <!-- Botón admin discreto -->
  <button class="admin-btn" id="admin-btn" onclick="handleAdminBtn()" title="Admin">
    <i class="ti ti-lock"></i> Admin
  </button>
</header>

<nav class="filter-bar">
  <button class="fbtn active" data-cat="all">Todo</button>
  <button class="fbtn" data-cat="accesorios">Accesorios</button>
  <button class="fbtn" data-cat="gorros">Gorros</button>
  <button class="fbtn" data-cat="joyeria">Joyería</button>
  <button class="fbtn" data-cat="insumos">Insumos</button>
</nav>

<main class="main">
  <div class="cart-bar">
    <div class="cart-left">
      <div class="cart-icon-wrap"><i class="ti ti-shopping-bag"></i></div>
      <div>
        <div class="cart-label">Mi carrito</div>
        <div class="cart-count" id="cc-lbl">0 productos</div>
      </div>
    </div>
    <div class="cart-right">
      <div class="cart-total" id="ct-disp">$0.00</div>
      <button class="cbtn" id="co-btn" disabled onclick="openCheckout()">Pedir →</button>
    </div>
  </div>

  <div class="sec-hdr">
    <div>
      <h2 class="sec-title" id="sec-title">Todos los productos</h2>
      <p class="sec-cnt" id="sec-cnt"></p>
    </div>
    <button class="add-new-btn" id="add-new-btn" onclick="openAddModal()" style="display:none">
      <i class="ti ti-plus"></i> Agregar producto
    </button>
  </div>

  <div id="loading-state" class="loading-state">
    <div class="spinner"></div>
    <span>Cargando catálogo...</span>
  </div>

  <div class="pgrid" id="pgrid"></div>
</main>

<!-- LOGIN MODAL -->
<div class="moverlay" id="login-modal">
  <div class="modal" style="max-width:360px">
    <div class="modal-title">🔐 Acceso Admin</div>
    <div class="fgrp">
      <label class="flbl" for="admin-password">Contraseña</label>
      <input class="finput" id="admin-password" type="password" placeholder="••••••••••">
      <div id="login-error" style="display:none;margin-top:8px;font-family:'Syne',sans-serif;font-size:11px;color:#C9637A;letter-spacing:1px">
        ✕ Contraseña incorrecta
      </div>
    </div>
    <div class="macts">
      <button class="msec" onclick="closeM('login-modal')">Cancelar</button>
      <button class="mprimary" onclick="submitLogin()">Entrar</button>
    </div>
  </div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="moverlay" id="add-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title-text">✦ Agregar producto</div>
    <input type="hidden" id="edit-id">
    <div class="fgrp">
      <label class="flbl" for="p-name">Nombre del producto</label>
      <input class="finput" id="p-name" placeholder="ej. Gorro quirúrgico floral">
    </div>
    <div class="fgrp">
      <label class="flbl" for="p-desc">Descripción</label>
      <input class="finput" id="p-desc" placeholder="ej. Algodón premium, diseño exclusivo">
    </div>
    <div class="frow">
      <div class="fgrp">
        <label class="flbl" for="p-price">Precio ($)</label>
        <input class="finput" id="p-price" type="number" step="0.01" placeholder="0.00">
      </div>
      <div class="fgrp">
        <label class="flbl" for="p-cat">Categoría</label>
        <select class="fsel" id="p-cat">
          <option value="accesorios">Accesorios</option>
          <option value="gorros">Gorros</option>
          <option value="joyeria">Joyería</option>
          <option value="insumos">Insumos</option>
        </select>
      </div>
    </div>
    <div class="frow">
      <div class="fgrp">
        <label class="flbl" for="p-badge">Etiqueta</label>
        <select class="fsel" id="p-badge">
          <option value="">Sin etiqueta</option>
          <option value="new">✦ Nuevo</option>
          <option value="fav">♡ Favorito</option>
          <option value="must">⚡ Must have</option>
        </select>
      </div>
      <div class="fgrp">
        <label class="flbl" for="p-stock">Cantidad <span class="flbl-note">(vacío = ∞)</span></label>
        <input class="finput" id="p-stock" type="number" min="0" step="1" placeholder="Ilimitado">
      </div>
    </div>
    <div class="fgrp">
      <label class="flbl">Disponibilidad</label>
      <button type="button" class="stock-toggle available" id="stock-toggle" onclick="toggleAgotado()">
        <i class="ti ti-circle-check"></i><span id="stock-toggle-txt">Disponible · tocar para marcar agotado</span>
      </button>
    </div>
    <div class="fgrp">
      <label class="flbl">Fotos del producto <span class="flbl-note">(máx. 5)</span></label>
      <input type="file" accept="image/*" class="hid" id="slot-file">
      <div class="multi-slots" id="multi-slots">
        <div class="img-slot empty" id="slot-0" onclick="trigSlotUpload(0)"><i class="ti ti-plus"></i></div>
        <div class="img-slot empty" id="slot-1" onclick="trigSlotUpload(1)"><i class="ti ti-plus"></i></div>
        <div class="img-slot empty" id="slot-2" onclick="trigSlotUpload(2)"><i class="ti ti-plus"></i></div>
        <div class="img-slot empty" id="slot-3" onclick="trigSlotUpload(3)"><i class="ti ti-plus"></i></div>
        <div class="img-slot empty" id="slot-4" onclick="trigSlotUpload(4)"><i class="ti ti-plus"></i></div>
      </div>
      <div class="upload-progress" id="upload-progress">
        <div class="upload-bar-wrap"><div class="upload-bar" id="upload-bar"></div></div>
        <span id="upload-label">Subiendo foto...</span>
      </div>
    </div>
    <div class="macts">
      <button class="msec" onclick="closeM('add-modal')">Cancelar</button>
      <button class="mdanger" id="del-btn" onclick="deleteProduct()">Eliminar</button>
      <button class="mprimary" id="save-btn" onclick="saveProduct()">Guardar</button>
    </div>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="moverlay" id="co-modal">
  <div class="modal">
    <div class="modal-title">🛍 Tu pedido</div>
    <div id="co-items"></div>
    <div class="co-total-line">
      <div class="co-total-lbl">Total</div>
      <div class="co-total-amt" id="co-total">$0.00</div>
    </div>
    <div style="margin-top:18px">
      <label class="flbl" style="display:block;margin-bottom:9px">¿Cómo vas a pagar?</label>
      <div class="payopts">
        <div class="popt sel" id="opt-t" onclick="selPay('transfer')"><i class="ti ti-transfer"></i><span>Transferencia</span></div>
        <div class="popt" id="opt-c" onclick="selPay('cash')"><i class="ti ti-cash"></i><span>Efectivo</span></div>
      </div>
    </div>
    <div class="fgrp">
      <label class="flbl" for="b-name">Tu nombre</label>
      <input class="finput" id="b-name" placeholder="¿Cómo te llamas?">
    </div>
    <div class="fgrp" id="addr-f">
      <label class="flbl" for="b-addr">Dirección de envío</label>
      <input class="finput" id="b-addr" placeholder="Ciudad, barrio, referencia">
    </div>
    <button class="wabtn" onclick="sendWA()"><i class="ti ti-brand-whatsapp"></i> Enviar pedido por WhatsApp</button>
    <div class="macts" style="margin-top:8px">
      <button class="msec" style="width:100%" onclick="closeM('co-modal')">Seguir viendo</button>
    </div>
  </div>
</div>


<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
